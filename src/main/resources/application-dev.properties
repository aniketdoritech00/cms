# =========================================================
# DATABASE 1 - CMS
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/CMS_DEV?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework=INFO
logging.level.com.doritech.tmsservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG


# =========================================================
# MAIL
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=testingcomplaint970@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# FILE STORAGE
# =========================================================
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

file.upload.image-path=D:/CMS-DEV/IMAGES

file.upload.max-size-mb=2048

